<!DOCTYPE html>

<html lang="pl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Logowanie - PetWorld</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#aad0b1",
                        "on-surface": "#181d1a",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#161d1b",
                        "tertiary-container": "#6a716e",
                        "on-secondary-fixed": "#00210e",
                        "on-primary-fixed": "#002113",
                        "on-primary-container": "#d0ffe3",
                        "primary-fixed-dim": "#88d6af",
                        "surface-tint": "#176b4b",
                        "primary-container": "#2e7d5b",
                        "background": "#f7faf5",
                        "tertiary": "#515956",
                        "surface-container-highest": "#e0e3df",
                        "tertiary-fixed-dim": "#c1c8c4",
                        "secondary-fixed": "#c5eccc",
                        "inverse-primary": "#88d6af",
                        "error": "#ba1a1a",
                        "surface-bright": "#f7faf5",
                        "inverse-surface": "#2d312e",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#a4f3ca",
                        "surface-dim": "#d7dbd6",
                        "on-secondary-fixed-variant": "#2c4e36",
                        "secondary-container": "#c2e9c9",
                        "on-tertiary-container": "#eff6f2",
                        "surface": "#f7faf5",
                        "surface-container-high": "#e6e9e4",
                        "on-background": "#181d1a",
                        "tertiary-fixed": "#dde4e0",
                        "on-tertiary-fixed-variant": "#414846",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e0e3df",
                        "surface-container": "#ebefea",
                        "outline-variant": "#bec9c1",
                        "inverse-on-surface": "#eef2ed",
                        "surface-container-low": "#f1f5ef",
                        "on-primary-fixed-variant": "#005236",
                        "on-error": "#ffffff",
                        "primary": "#096444",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#486a51",
                        "on-error-container": "#93000a",
                        "secondary": "#43664d",
                        "outline": "#6f7a72",
                        "on-surface-variant": "#3f4943"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "md": "24px",
                        "container-max": "1280px",
                        "base": "8px",
                        "lg": "48px",
                        "gutter": "24px",
                        "xl": "80px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-md text-on-surface">
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_20px_rgba(31,36,33,0.05)] p-lg">
<!-- Logo & Header -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-md">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Zaloguj się</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Witaj ponownie w PetWorld</p>
</div>
<!-- Form -->
<form class="space-y-md">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Adres e-mail</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="w-full pl-lg pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-[10px] focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 transition-colors" id="email" name="email" placeholder="twój@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Hasło</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full pl-lg pr-lg py-sm bg-surface-container-lowest border border-outline-variant rounded-[10px] focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" id="togglePassword">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded-[4px] cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                        Zapamiętaj mnie
                    </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
                        Nie pamiętasz hasła?
                    </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center py-sm px-4 border border-transparent rounded-[10px] shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                    Zaloguj się
                </button>
</div>
</form>
<!-- Divider -->
<div class="mt-lg mb-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest font-body-md text-body-md text-on-surface-variant">
                        lub
                    </span>
</div>
</div>
</div>
<!-- Google Login -->
<div>
<button class="w-full flex items-center justify-center gap-sm py-sm px-4 border border-outline rounded-[10px] shadow-sm bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
<path d="M1 1h22v22H1z" fill="none"></path>
</svg>
                Kontynuuj z Google
            </button>
</div>
<!-- Sign Up Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Nie masz konta? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-1" href="#">
                    Zarejestruj się
                </a>
</p>
</div>
</main>
<script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
