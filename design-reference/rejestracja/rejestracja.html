<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md md:p-lg">
<div class="w-full max-w-md bg-surface-container-lowest rounded-[1rem] shadow-[0px_4px_20px_rgba(31,36,33,0.05)] p-lg overflow-hidden relative">
<div class="absolute -top-32 -left-32 w-64 h-64 bg-secondary-container rounded-full opacity-20 blur-3xl"></div>
<div class="absolute -bottom-32 -right-32 w-64 h-64 bg-primary-container rounded-full opacity-10 blur-3xl"></div>
<div class="relative z-10">
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-low rounded-full mb-md">
<span class="material-symbols-outlined text-[32px] text-primary">pets</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg">Załóż konto</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Dołącz do społeczności PetWorld.</p>
</div>
<form class="space-y-md">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="name">Imię</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-[10px] px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-on-surface-variant/50" id="name" name="name" placeholder="Twoje imię" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Adres e-mail</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-[10px] px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="twoj.adres@email.pl" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Hasło</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-[10px] pl-md pr-xl py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password_confirm">Powtórz hasło</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-[10px] px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-on-surface-variant/50" id="password_confirm" name="password_confirm" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="w-5 h-5 bg-surface-container-lowest border border-outline-variant rounded-[4px] text-primary focus:ring-primary focus:ring-2 focus:ring-offset-1 focus:ring-offset-surface cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="terms">
                            Akceptuję <a class="text-primary hover:underline font-label-md" href="#">regulamin</a> i <a class="text-primary hover:underline font-label-md" href="#">politykę prywatności</a>
</label>
</div>
</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md rounded-[10px] py-[14px] px-md transition-colors shadow-sm active:scale-[0.98] transform" type="submit">
                    Zarejestruj się
                </button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Masz już konto? <a class="text-primary font-label-md hover:underline" href="#">Zaloguj się</a>
</p>
</div>
</div>
</div>
</body></html>
